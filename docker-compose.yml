services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: courses_api
    ports:
      - "8002:8000"
    env_file:
      - ./.env
    environment:
      # The PostgreSQL container is reachable by its Compose service name on
      # the shared external network. This overrides the localhost value used
      # when courses_service runs directly on the host.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - ./:/app:rw
    networks:
      - junkie_net

networks:
  junkie_net:
    external: true
