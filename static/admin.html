<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course Studio</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211b;
      --muted: #68736d;
      --paper: #f3f1e9;
      --card: #fffefa;
      --line: #ddd9cd;
      --brand: #246b4a;
      --brand-soft: #dfeee5;
      --danger: #a33d30;
      --shadow: 0 18px 50px rgba(34, 49, 40, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 7% 0%, rgba(242, 190, 91, .22), transparent 27rem),
        var(--paper);
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 72px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 30px; }
    .eyebrow { color: var(--brand); font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 8px 0 5px; font-family: Georgia, serif; font-size: clamp(36px, 5vw, 60px); font-weight: 500; letter-spacing: -.04em; }
    header p { margin: 0; color: var(--muted); }
    .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #53a777; box-shadow: 0 0 0 5px var(--brand-soft); }
    .layout { display: grid; grid-template-columns: minmax(270px, .8fr) minmax(0, 1.7fr); gap: 18px; }
    .panel { background: rgba(255, 254, 250, .9); border: 1px solid rgba(221, 217, 205, .85); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
    .panel-head { padding: 22px 22px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    h2 { margin: 0; font-size: 17px; }
    .count { color: var(--muted); font-size: 13px; }
    .course-list { padding: 10px; max-height: 610px; overflow: auto; }
    .course {
      width: 100%; padding: 14px; border: 0; border-radius: 13px; background: transparent;
      text-align: left; color: var(--ink); display: flex; justify-content: space-between; gap: 10px; align-items: center;
    }
    .course:hover { background: #f5f3eb; }
    .course.active { background: var(--brand-soft); color: #164e34; }
    .course strong { display: block; overflow: hidden; text-overflow: ellipsis; }
    .course small { color: var(--muted); white-space: nowrap; }
    .empty { padding: 55px 24px; text-align: center; color: var(--muted); }
    .lessons { padding: 14px; min-height: 390px; }
    .lesson {
      display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 12px;
      padding: 13px; margin-bottom: 9px; border: 1px solid var(--line); border-radius: 13px; background: var(--card);
    }
    .position { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--paper); color: var(--muted); font-size: 12px; font-weight: 800; }
    .lesson-title { font-weight: 750; }
    .lesson-meta { margin-top: 4px; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .actions { display: flex; gap: 5px; }
    .icon-btn, .btn { border: 1px solid var(--line); color: var(--ink); background: var(--card); border-radius: 10px; }
    .icon-btn { width: 33px; height: 33px; }
    .icon-btn:hover, .btn.secondary:hover { border-color: #aaa598; }
    .btn { padding: 9px 14px; font-weight: 750; }
    .btn.primary { color: white; background: var(--brand); border-color: var(--brand); }
    .btn.danger { color: var(--danger); }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
    dialog { width: min(520px, calc(100% - 28px)); padding: 0; border: 0; border-radius: 20px; box-shadow: 0 30px 90px rgba(23, 33, 27, .25); }
    dialog::backdrop { background: rgba(23, 33, 27, .4); backdrop-filter: blur(3px); }
    form { padding: 26px; }
    form h2 { font-family: Georgia, serif; font-size: 28px; font-weight: 500; margin-bottom: 22px; }
    label { display: block; margin: 14px 0 6px; color: var(--muted); font-size: 13px; font-weight: 700; }
    input, textarea, select { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); background: white; outline: none; }
    input:focus, textarea:focus, select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
    textarea { min-height: 110px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .form-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 24px; }
    .form-actions div { display: flex; gap: 8px; }
    .toast { position: fixed; right: 20px; bottom: 20px; max-width: 360px; padding: 13px 16px; border-radius: 12px; color: white; background: var(--ink); box-shadow: var(--shadow); opacity: 0; transform: translateY(12px); pointer-events: none; transition: .2s; }
    .toast.show { opacity: 1; transform: none; }
    .toast.error { background: var(--danger); }
    @media (max-width: 760px) {
      .shell { padding-top: 28px; }
      header { align-items: start; flex-direction: column; }
      .layout { grid-template-columns: 1fr; }
      .course-list { max-height: 270px; }
      .panel-head { align-items: flex-start; flex-direction: column; }
      .lesson { grid-template-columns: 34px minmax(0, 1fr); }
      .actions { grid-column: 2; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="eyebrow">Learning workspace</div>
        <h1>Course Studio</h1>
        <p>Shape your courses, lesson content, and learning flow.</p>
      </div>
      <div class="status">Saved locally</div>
    </header>

    <section class="layout">
      <aside class="panel">
        <div class="panel-head">
          <div><h2>Courses</h2><span class="count" id="courseCount"></span></div>
          <button class="btn primary" id="newCourse">+ Course</button>
        </div>
        <div class="course-list" id="courseList"></div>
      </aside>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2 id="lessonHeading">Select a course</h2>
            <span class="count" id="lessonCount">Choose a course to manage its lessons</span>
          </div>
          <div class="toolbar">
            <button class="btn secondary" id="editCourse" hidden>Edit course</button>
            <button class="btn primary" id="newLesson" hidden>+ Lesson</button>
          </div>
        </div>
        <div class="lessons" id="lessonList">
          <div class="empty">Your lesson sequence will appear here.</div>
        </div>
      </section>
    </section>
  </main>

  <dialog id="courseDialog">
    <form id="courseForm">
      <h2 id="courseFormTitle">New course</h2>
      <input type="hidden" id="courseId">
      <label for="courseTitle">Title</label>
      <input id="courseTitle" maxlength="160" required placeholder="e.g. Reset your sleep">
      <label for="courseDescription">Description</label>
      <textarea id="courseDescription" maxlength="2000" placeholder="What will people learn?"></textarea>
      <div class="form-actions">
        <button type="button" class="btn danger" id="deleteCourse" hidden>Delete</button>
        <div>
          <button type="button" class="btn secondary" data-close="courseDialog">Cancel</button>
          <button class="btn primary">Save course</button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="lessonDialog">
    <form id="lessonForm">
      <h2 id="lessonFormTitle">New lesson</h2>
      <input type="hidden" id="lessonId">
      <label for="lessonTitle">Title</label>
      <input id="lessonTitle" maxlength="160" required placeholder="e.g. Notice your patterns">
      <label for="lessonCourse">Course</label>
      <select id="lessonCourse"></select>
      <label for="lessonData">Lesson data (JSON)</label>
      <textarea id="lessonData" spellcheck="false">{}</textarea>
      <div class="form-actions">
        <button type="button" class="btn danger" id="deleteLesson" hidden>Delete</button>
        <div>
          <button type="button" class="btn secondary" data-close="lessonDialog">Cancel</button>
          <button class="btn primary">Save lesson</button>
        </div>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast"></div>

  <script>
    const state = { courses: [], lessons: [], selectedCourseId: null };
    const $ = selector => document.querySelector(selector);

    async function api(path, options = {}) {
      const response = await fetch(path, {
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        ...options
      });
      if (!response.ok) {
        let message = `Request failed (${response.status})`;
        try { message = (await response.json()).detail || message; } catch (_) {}
        throw new Error(message);
      }
      return response.status === 204 ? null : response.json();
    }

    function notify(message, error = false) {
      const toast = $("#toast");
      toast.textContent = message;
      toast.className = `toast show${error ? " error" : ""}`;
      clearTimeout(notify.timer);
      notify.timer = setTimeout(() => toast.className = "toast", 2600);
    }

    async function loadCourses(keepSelection = true) {
      state.courses = await api("/api/admin/courses");
      if (!keepSelection || !state.courses.some(c => c.id === state.selectedCourseId)) {
        state.selectedCourseId = state.courses[0]?.id ?? null;
      }
      renderCourses();
      await loadLessons();
    }

    async function loadLessons() {
      if (!state.selectedCourseId) {
        state.lessons = [];
        renderLessons();
        return;
      }
      state.lessons = await api(`/api/admin/lessons?course_id=${state.selectedCourseId}`);
      renderLessons();
    }

    function renderCourses() {
      $("#courseCount").textContent = `${state.courses.length} total`;
      $("#courseList").innerHTML = state.courses.length
        ? state.courses.map(course => `
          <button class="course ${course.id === state.selectedCourseId ? "active" : ""}" data-course="${course.id}">
            <strong>${escapeHtml(course.title)}</strong>
            <small>${course.lesson_count} lesson${course.lesson_count === 1 ? "" : "s"}</small>
          </button>`).join("")
        : `<div class="empty">No courses yet.<br>Create your first one.</div>`;
      document.querySelectorAll("[data-course]").forEach(button => {
        button.onclick = async () => {
          state.selectedCourseId = Number(button.dataset.course);
          renderCourses();
          await loadLessons();
        };
      });
    }

    function renderLessons() {
      const course = selectedCourse();
      $("#lessonHeading").textContent = course?.title || "Select a course";
      $("#lessonCount").textContent = course
        ? `${state.lessons.length} lesson${state.lessons.length === 1 ? "" : "s"} · order defines the learning path`
        : "Choose a course to manage its lessons";
      $("#newLesson").hidden = !course;
      $("#editCourse").hidden = !course;
      if (!course) {
        $("#lessonList").innerHTML = `<div class="empty">Your lesson sequence will appear here.</div>`;
        return;
      }
      if (!state.lessons.length) {
        $("#lessonList").innerHTML = `<div class="empty">This course has no lessons yet.<br>Add one to begin the sequence.</div>`;
        return;
      }
      $("#lessonList").innerHTML = state.lessons.map((lesson, index) => `
        <article class="lesson">
          <span class="position">${index + 1}</span>
          <div>
            <div class="lesson-title">${escapeHtml(lesson.title)}</div>
            <div class="lesson-meta">${escapeHtml(JSON.stringify(lesson.data))}${lesson.next_lesson_id ? ` · next → #${lesson.next_lesson_id}` : " · final lesson"}</div>
          </div>
          <div class="actions">
            <button class="icon-btn" title="Move up" data-up="${lesson.id}" ${index === 0 ? "disabled" : ""}>↑</button>
            <button class="icon-btn" title="Move down" data-down="${lesson.id}" ${index === state.lessons.length - 1 ? "disabled" : ""}>↓</button>
            <button class="icon-btn" title="Edit lesson" data-edit-lesson="${lesson.id}">✎</button>
          </div>
        </article>`).join("");
      document.querySelectorAll("[data-up]").forEach(button => button.onclick = () => moveLesson(Number(button.dataset.up), -1));
      document.querySelectorAll("[data-down]").forEach(button => button.onclick = () => moveLesson(Number(button.dataset.down), 1));
      document.querySelectorAll("[data-edit-lesson]").forEach(button => button.onclick = () => openLesson(Number(button.dataset.editLesson)));
    }

    async function moveLesson(id, direction) {
      const ids = state.lessons.map(lesson => lesson.id);
      const index = ids.indexOf(id);
      [ids[index], ids[index + direction]] = [ids[index + direction], ids[index]];
      state.lessons = await api(`/api/admin/courses/${state.selectedCourseId}/lessons/reorder`, {
        method: "POST", body: JSON.stringify({ lesson_ids: ids })
      });
      renderLessons();
      notify("Lesson order updated");
    }

    function selectedCourse() {
      return state.courses.find(course => course.id === state.selectedCourseId);
    }

    function openCourse(course = null) {
      $("#courseForm").reset();
      $("#courseId").value = course?.id || "";
      $("#courseTitle").value = course?.title || "";
      $("#courseDescription").value = course?.description || "";
      $("#courseFormTitle").textContent = course ? "Edit course" : "New course";
      $("#deleteCourse").hidden = !course;
      $("#courseDialog").showModal();
      $("#courseTitle").focus();
    }

    function openLesson(id = null) {
      const lesson = state.lessons.find(item => item.id === id);
      $("#lessonForm").reset();
      $("#lessonCourse").innerHTML =
        `<option value="">Unassigned</option>` +
        state.courses.map(course => `<option value="${course.id}">${escapeHtml(course.title)}</option>`).join("");
      $("#lessonId").value = lesson?.id || "";
      $("#lessonTitle").value = lesson?.title || "";
      $("#lessonCourse").value = lesson?.course_id ?? state.selectedCourseId ?? "";
      $("#lessonData").value = JSON.stringify(lesson?.data || {}, null, 2);
      $("#lessonFormTitle").textContent = lesson ? "Edit lesson" : "New lesson";
      $("#deleteLesson").hidden = !lesson;
      $("#lessonDialog").showModal();
      $("#lessonTitle").focus();
    }

    $("#courseForm").onsubmit = async event => {
      event.preventDefault();
      const id = $("#courseId").value;
      const payload = { title: $("#courseTitle").value, description: $("#courseDescription").value };
      try {
        const saved = await api(id ? `/api/admin/courses/${id}` : "/api/admin/courses", {
          method: id ? "PUT" : "POST", body: JSON.stringify(payload)
        });
        state.selectedCourseId = saved.id;
        $("#courseDialog").close();
        await loadCourses();
        notify(id ? "Course updated" : "Course created");
      } catch (error) { notify(error.message, true); }
    };

    $("#lessonForm").onsubmit = async event => {
      event.preventDefault();
      let data;
      try { data = JSON.parse($("#lessonData").value || "{}"); }
      catch (_) { notify("Lesson data is not valid JSON", true); return; }
      if (Array.isArray(data) || data === null || typeof data !== "object") {
        notify("Lesson data must be a JSON object", true); return;
      }
      const id = $("#lessonId").value;
      const payload = {
        title: $("#lessonTitle").value,
        course_id: $("#lessonCourse").value ? Number($("#lessonCourse").value) : null,
        data
      };
      try {
        const saved = await api(id ? `/api/admin/lessons/${id}` : "/api/admin/lessons", {
          method: id ? "PUT" : "POST", body: JSON.stringify(payload)
        });
        if (saved.course_id) state.selectedCourseId = saved.course_id;
        $("#lessonDialog").close();
        await loadCourses();
        notify(id ? "Lesson updated" : "Lesson created");
      } catch (error) { notify(error.message, true); }
    };

    $("#deleteCourse").onclick = async () => {
      if (!confirm("Delete this course? Its lessons will become unassigned.")) return;
      try {
        await api(`/api/admin/courses/${$("#courseId").value}`, { method: "DELETE" });
        $("#courseDialog").close();
        state.selectedCourseId = null;
        await loadCourses(false);
        notify("Course deleted");
      } catch (error) { notify(error.message, true); }
    };

    $("#deleteLesson").onclick = async () => {
      if (!confirm("Delete this lesson permanently?")) return;
      try {
        await api(`/api/admin/lessons/${$("#lessonId").value}`, { method: "DELETE" });
        $("#lessonDialog").close();
        await loadCourses();
        notify("Lesson deleted");
      } catch (error) { notify(error.message, true); }
    };

    $("#newCourse").onclick = () => openCourse();
    $("#editCourse").onclick = () => openCourse(selectedCourse());
    $("#newLesson").onclick = () => openLesson();
    document.querySelectorAll("[data-close]").forEach(button => {
      button.onclick = () => document.getElementById(button.dataset.close).close();
    });

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[char]);
    }

    loadCourses().catch(error => notify(error.message, true));
  </script>
</body>
</html>
