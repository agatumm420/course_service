<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course Studio</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211b;
      --muted: #68736d;
      --paper: #f3f1e9;
      --card: #fffefa;
      --line: #ddd9cd;
      --brand: #246b4a;
      --brand-soft: #dfeee5;
      --danger: #a33d30;
      --shadow: 0 18px 50px rgba(34, 49, 40, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 7% 0%, rgba(242, 190, 91, .22), transparent 27rem),
        var(--paper);
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 72px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 30px; }
    .eyebrow { color: var(--brand); font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 8px 0 5px; font-family: Georgia, serif; font-size: clamp(36px, 5vw, 60px); font-weight: 500; letter-spacing: -.04em; }
    header p { margin: 0; color: var(--muted); }
    .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #53a777; box-shadow: 0 0 0 5px var(--brand-soft); }
    .layout { display: grid; grid-template-columns: minmax(270px, .8fr) minmax(0, 1.7fr); gap: 18px; }
    .panel { background: rgba(255, 254, 250, .9); border: 1px solid rgba(221, 217, 205, .85); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
    .panel-head { padding: 22px 22px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    h2 { margin: 0; font-size: 17px; }
    .count { color: var(--muted); font-size: 13px; }
    .course-list { padding: 10px; max-height: 610px; overflow: auto; }
    .course {
      width: 100%; padding: 14px; border: 0; border-radius: 13px; background: transparent;
      text-align: left; color: var(--ink); display: flex; justify-content: space-between; gap: 10px; align-items: center;
    }
    .course:hover { background: #f5f3eb; }
    .course.active { background: var(--brand-soft); color: #164e34; }
    .course strong { display: block; overflow: hidden; text-overflow: ellipsis; }
    .course small { color: var(--muted); white-space: nowrap; }
    .empty { padding: 55px 24px; text-align: center; color: var(--muted); }
    .lessons { padding: 14px; min-height: 390px; }
    .lesson {
      display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 12px;
      padding: 13px; margin-bottom: 9px; border: 1px solid var(--line); border-radius: 13px; background: var(--card);
    }
    .position { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--paper); color: var(--muted); font-size: 12px; font-weight: 800; }
    .lesson-title { font-weight: 750; }
    .lesson-meta { margin-top: 4px; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .actions { display: flex; gap: 5px; }
    .icon-btn, .btn { border: 1px solid var(--line); color: var(--ink); background: var(--card); border-radius: 10px; }
    .icon-btn { width: 33px; height: 33px; }
    .icon-btn:hover, .btn.secondary:hover { border-color: #aaa598; }
    .btn { padding: 9px 14px; font-weight: 750; }
    .btn.primary { color: white; background: var(--brand); border-color: var(--brand); }
    .btn.danger { color: var(--danger); }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
    dialog { width: min(520px, calc(100% - 28px)); padding: 0; border: 0; border-radius: 20px; box-shadow: 0 30px 90px rgba(23, 33, 27, .25); }
    #lessonDialog { width: min(820px, calc(100% - 28px)); max-height: 92vh; overflow: auto; }
    dialog::backdrop { background: rgba(23, 33, 27, .4); backdrop-filter: blur(3px); }
    form { padding: 26px; }
    form h2 { font-family: Georgia, serif; font-size: 28px; font-weight: 500; margin-bottom: 22px; }
    label { display: block; margin: 14px 0 6px; color: var(--muted); font-size: 13px; font-weight: 700; }
    input, textarea, select { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); background: white; outline: none; }
    input:focus, textarea:focus, select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
    textarea { min-height: 110px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .component-editor-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 20px; }
    .component-editor-head label { margin: 0; }
    .saved-component-picker { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-top: 10px; }
    .component-editor { display: grid; gap: 12px; margin-top: 10px; }
    .component-card { padding: 14px; border: 1px solid var(--line); border-radius: 13px; background: #faf9f4; }
    .component-card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .component-card-head strong { font-size: 14px; }
    .component-identity { flex: 1; }
    .component-identity label { margin-top: 8px; }
    .component-badge { display: inline-block; margin-left: 7px; padding: 3px 7px; border-radius: 999px; color: var(--brand); background: var(--brand-soft); font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .component-fields { display: grid; gap: 10px; margin-top: 12px; }
    .component-field { display: grid; grid-template-columns: minmax(130px, .7fr) minmax(150px, 1fr) minmax(190px, 1.3fr) auto; gap: 8px; align-items: end; padding-top: 10px; border-top: 1px solid var(--line); }
    .component-field label { margin-top: 0; }
    .component-field textarea { min-height: 44px; }
    .component-empty { padding: 20px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); text-align: center; }
    .add-field { margin-top: 12px; }
    .form-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 24px; }
    .form-actions div { display: flex; gap: 8px; }
    .toast { position: fixed; right: 20px; bottom: 20px; max-width: 360px; padding: 13px 16px; border-radius: 12px; color: white; background: var(--ink); box-shadow: var(--shadow); opacity: 0; transform: translateY(12px); pointer-events: none; transition: .2s; }
    .toast.show { opacity: 1; transform: none; }
    .toast.error { background: var(--danger); }
    @media (max-width: 760px) {
      .shell { padding-top: 28px; }
      header { align-items: start; flex-direction: column; }
      .layout { grid-template-columns: 1fr; }
      .course-list { max-height: 270px; }
      .panel-head { align-items: flex-start; flex-direction: column; }
      .lesson { grid-template-columns: 34px minmax(0, 1fr); }
      .actions { grid-column: 2; }
      .component-field { grid-template-columns: 1fr; }
      .saved-component-picker { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="eyebrow">Learning workspace</div>
        <h1>Course Studio</h1>
        <p>Shape your courses, lesson content, and learning flow.</p>
      </div>
      <div class="status">Saved locally</div>
    </header>

    <section class="layout">
      <aside class="panel">
        <div class="panel-head">
          <div><h2>Courses</h2><span class="count" id="courseCount"></span></div>
          <button class="btn primary" id="newCourse">+ Course</button>
        </div>
        <div class="course-list" id="courseList"></div>
      </aside>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2 id="lessonHeading">Select a course</h2>
            <span class="count" id="lessonCount">Choose a course to manage its lessons</span>
          </div>
          <div class="toolbar">
            <button class="btn secondary" id="editCourse" hidden>Edit course</button>
            <button class="btn primary" id="newLesson" hidden>+ Lesson</button>
          </div>
        </div>
        <div class="lessons" id="lessonList">
          <div class="empty">Your lesson sequence will appear here.</div>
        </div>
      </section>
    </section>
  </main>

  <dialog id="courseDialog">
    <form id="courseForm">
      <h2 id="courseFormTitle">New course</h2>
      <input type="hidden" id="courseId">
      <label for="courseTitle">Title</label>
      <input id="courseTitle" maxlength="160" required placeholder="e.g. Reset your sleep">
      <label for="courseDescription">Description</label>
      <textarea id="courseDescription" maxlength="2000" placeholder="What will people learn?"></textarea>
      <div class="form-actions">
        <button type="button" class="btn danger" id="deleteCourse" hidden>Delete</button>
        <div>
          <button type="button" class="btn secondary" data-close="courseDialog">Cancel</button>
          <button class="btn primary">Save course</button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="lessonDialog">
    <form id="lessonForm">
      <h2 id="lessonFormTitle">New lesson</h2>
      <input type="hidden" id="lessonId">
      <label for="lessonTitle">Title</label>
      <input id="lessonTitle" maxlength="100" required placeholder="e.g. Notice your patterns">
      <label for="lessonCourse">Course</label>
      <select id="lessonCourse"></select>
      <div class="component-editor-head">
        <label>Components</label>
        <button type="button" class="btn secondary" id="addComponent">+ New component</button>
      </div>
      <div class="saved-component-picker">
        <select id="savedComponentSelect" aria-label="Saved component"></select>
        <button type="button" class="btn secondary" id="addSavedComponent">Add saved component</button>
      </div>
      <div class="component-editor" id="componentEditor"></div>
      <div class="form-actions">
        <button type="button" class="btn danger" id="deleteLesson" hidden>Delete</button>
        <div>
          <button type="button" class="btn secondary" data-close="lessonDialog">Cancel</button>
          <button class="btn primary">Save lesson</button>
        </div>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast"></div>

  <script>
    const state = { courses: [], lessons: [], components: [], selectedCourseId: null };
    let draftComponents = [];
    const $ = selector => document.querySelector(selector);

    async function api(path, options = {}) {
      const response = await fetch(path, {
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        ...options
      });
      if (!response.ok) {
        let message = `Request failed (${response.status})`;
        try { message = (await response.json()).detail || message; } catch (_) {}
        throw new Error(message);
      }
      return response.status === 204 ? null : response.json();
    }

    function notify(message, error = false) {
      const toast = $("#toast");
      toast.textContent = message;
      toast.className = `toast show${error ? " error" : ""}`;
      clearTimeout(notify.timer);
      notify.timer = setTimeout(() => toast.className = "toast", 2600);
    }

    async function loadCourses(keepSelection = true) {
      [state.courses, state.components] = await Promise.all([
        api("/api/admin/courses"),
        api("/api/admin/components")
      ]);
      if (!keepSelection || !state.courses.some(c => c.id === state.selectedCourseId)) {
        state.selectedCourseId = state.courses[0]?.id ?? null;
      }
      renderCourses();
      await loadLessons();
    }

    async function loadLessons() {
      if (!state.selectedCourseId) {
        state.lessons = [];
        renderLessons();
        return;
      }
      state.lessons = await api(`/api/admin/lessons?course_id=${state.selectedCourseId}`);
      renderLessons();
    }

    function renderCourses() {
      $("#courseCount").textContent = `${state.courses.length} total`;
      $("#courseList").innerHTML = state.courses.length
        ? state.courses.map(course => `
          <button class="course ${course.id === state.selectedCourseId ? "active" : ""}" data-course="${course.id}">
            <strong>${escapeHtml(course.title)}</strong>
            <small>${course.lesson_count} lesson${course.lesson_count === 1 ? "" : "s"}</small>
          </button>`).join("")
        : `<div class="empty">No courses yet.<br>Create your first one.</div>`;
      document.querySelectorAll("[data-course]").forEach(button => {
        button.onclick = async () => {
          state.selectedCourseId = Number(button.dataset.course);
          renderCourses();
          await loadLessons();
        };
      });
    }

    function renderLessons() {
      const course = selectedCourse();
      $("#lessonHeading").textContent = course?.title || "Select a course";
      $("#lessonCount").textContent = course
        ? `${state.lessons.length} lesson${state.lessons.length === 1 ? "" : "s"} · order defines the learning path`
        : "Choose a course to manage its lessons";
      $("#newLesson").hidden = !course;
      $("#editCourse").hidden = !course;
      if (!course) {
        $("#lessonList").innerHTML = `<div class="empty">Your lesson sequence will appear here.</div>`;
        return;
      }
      if (!state.lessons.length) {
        $("#lessonList").innerHTML = `<div class="empty">This course has no lessons yet.<br>Add one to begin the sequence.</div>`;
        return;
      }
      $("#lessonList").innerHTML = state.lessons.map((lesson, index) => `
        <article class="lesson">
          <span class="position">${index + 1}</span>
          <div>
            <div class="lesson-title">${escapeHtml(lesson.title)}</div>
            <div class="lesson-meta">${escapeHtml(lesson.components.map(component => component.name).join(" · ") || "No components")} · ${lesson.components.reduce((total, component) => total + component.fields.length, 0)} fields${lesson.next_lesson_id ? ` · next → #${lesson.next_lesson_id}` : " · final lesson"}</div>
          </div>
          <div class="actions">
            <button class="icon-btn" title="Move up" data-up="${lesson.id}" ${index === 0 ? "disabled" : ""}>↑</button>
            <button class="icon-btn" title="Move down" data-down="${lesson.id}" ${index === state.lessons.length - 1 ? "disabled" : ""}>↓</button>
            <button class="icon-btn" title="Edit lesson" data-edit-lesson="${lesson.id}">✎</button>
          </div>
        </article>`).join("");
      document.querySelectorAll("[data-up]").forEach(button => button.onclick = () => moveLesson(Number(button.dataset.up), -1));
      document.querySelectorAll("[data-down]").forEach(button => button.onclick = () => moveLesson(Number(button.dataset.down), 1));
      document.querySelectorAll("[data-edit-lesson]").forEach(button => button.onclick = () => openLesson(Number(button.dataset.editLesson)));
    }

    async function moveLesson(id, direction) {
      const ids = state.lessons.map(lesson => lesson.id);
      const index = ids.indexOf(id);
      [ids[index], ids[index + direction]] = [ids[index + direction], ids[index]];
      state.lessons = await api(`/api/admin/courses/${state.selectedCourseId}/lessons/reorder`, {
        method: "POST", body: JSON.stringify({ lesson_ids: ids })
      });
      renderLessons();
      notify("Lesson order updated");
    }

    function selectedCourse() {
      return state.courses.find(course => course.id === state.selectedCourseId);
    }

    function openCourse(course = null) {
      $("#courseForm").reset();
      $("#courseId").value = course?.id || "";
      $("#courseTitle").value = course?.title || "";
      $("#courseDescription").value = course?.description || "";
      $("#courseFormTitle").textContent = course ? "Edit course" : "New course";
      $("#deleteCourse").hidden = !course;
      $("#courseDialog").showModal();
      $("#courseTitle").focus();
    }

    function openLesson(id = null) {
      const lesson = state.lessons.find(item => item.id === id);
      $("#lessonForm").reset();
      $("#lessonCourse").innerHTML =
        `<option value="">Unassigned</option>` +
        state.courses.map(course => `<option value="${course.id}">${escapeHtml(course.title)}</option>`).join("");
      $("#lessonId").value = lesson?.id || "";
      $("#lessonTitle").value = lesson?.title || "";
      $("#lessonCourse").value = lesson?.course_id ?? state.selectedCourseId ?? "";
      draftComponents = lesson
        ? lesson.components.map(component => ({
            id: component.id,
            existing: true,
            name: component.name,
            fields: component.fields.map(field => ({
              name: field.name,
              value: field.value || "",
              dataText: field.data === null ? "" : JSON.stringify(field.data, null, 2)
            }))
          }))
        : [newComponent()];
      renderComponentEditor();
      $("#lessonFormTitle").textContent = lesson ? "Edit lesson" : "New lesson";
      $("#deleteLesson").hidden = !lesson;
      $("#lessonDialog").showModal();
      $("#lessonTitle").focus();
    }

    $("#courseForm").onsubmit = async event => {
      event.preventDefault();
      const id = $("#courseId").value;
      const payload = { title: $("#courseTitle").value, description: $("#courseDescription").value };
      try {
        const saved = await api(id ? `/api/admin/courses/${id}` : "/api/admin/courses", {
          method: id ? "PUT" : "POST", body: JSON.stringify(payload)
        });
        state.selectedCourseId = saved.id;
        $("#courseDialog").close();
        await loadCourses();
        notify(id ? "Course updated" : "Course created");
      } catch (error) { notify(error.message, true); }
    };

    $("#lessonForm").onsubmit = async event => {
      event.preventDefault();
      const id = $("#lessonId").value;
      const components = [];
      const newComponentNames = new Set();
      for (const component of draftComponents) {
        if (component.existing) {
          components.push({ component_id: component.id });
          continue;
        }
        const componentName = component.name.trim();
        if (!componentName) {
          notify("Every component needs a name", true); return;
        }
        if (state.components.some(saved => saved.name === componentName) || newComponentNames.has(componentName)) {
          notify(`A component named “${componentName}” already exists`, true); return;
        }
        newComponentNames.add(componentName);
        const fields = [];
        for (const field of component.fields) {
          const name = field.name.trim();
          if (!name) {
            notify("Every component field needs a name", true); return;
          }
          let data = null;
          if (field.dataText.trim()) {
            try { data = JSON.parse(field.dataText); }
            catch (_) { notify(`JSON data for field “${name}” is invalid`, true); return; }
          }
          fields.push({ name, value: field.value.trim() || null, data });
        }
        components.push({ name: componentName, fields });
      }
      const payload = {
        title: $("#lessonTitle").value,
        course_id: $("#lessonCourse").value ? Number($("#lessonCourse").value) : null,
        components
      };
      try {
        const saved = await api(id ? `/api/admin/lessons/${id}` : "/api/admin/lessons", {
          method: id ? "PUT" : "POST", body: JSON.stringify(payload)
        });
        if (saved.course_id) state.selectedCourseId = saved.course_id;
        $("#lessonDialog").close();
        await loadCourses();
        notify(id ? "Lesson updated" : "Lesson created");
      } catch (error) { notify(error.message, true); }
    };

    $("#deleteCourse").onclick = async () => {
      if (!confirm("Delete this course? Its lessons will become unassigned.")) return;
      try {
        await api(`/api/admin/courses/${$("#courseId").value}`, { method: "DELETE" });
        $("#courseDialog").close();
        state.selectedCourseId = null;
        await loadCourses(false);
        notify("Course deleted");
      } catch (error) { notify(error.message, true); }
    };

    $("#deleteLesson").onclick = async () => {
      if (!confirm("Delete this lesson permanently?")) return;
      try {
        await api(`/api/admin/lessons/${$("#lessonId").value}`, { method: "DELETE" });
        $("#lessonDialog").close();
        await loadCourses();
        notify("Lesson deleted");
      } catch (error) { notify(error.message, true); }
    };

    $("#newCourse").onclick = () => openCourse();
    $("#editCourse").onclick = () => openCourse(selectedCourse());
    $("#newLesson").onclick = () => openLesson();
    $("#addComponent").onclick = () => {
      draftComponents.push(newComponent());
      renderComponentEditor();
    };
    $("#addSavedComponent").onclick = () => {
      const componentId = Number($("#savedComponentSelect").value);
      const component = state.components.find(item => item.id === componentId);
      if (!component || draftComponents.some(item => item.id === componentId)) return;
      draftComponents.push(existingComponent(component));
      renderComponentEditor();
    };
    document.querySelectorAll("[data-close]").forEach(button => {
      button.onclick = () => document.getElementById(button.dataset.close).close();
    });

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[char]);
    }

    function newField() {
      return { name: "", value: "", dataText: "" };
    }

    function newComponent() {
      return { id: null, existing: false, name: "", fields: [newField()] };
    }

    function existingComponent(component) {
      return {
        id: component.id,
        existing: true,
        name: component.name,
        fields: component.fields.map(field => ({
          name: field.name,
          value: field.value || "",
          dataText: field.data === null ? "" : JSON.stringify(field.data, null, 2)
        }))
      };
    }

    function renderComponentEditor() {
      $("#componentEditor").innerHTML = draftComponents.length
        ? draftComponents.map((component, componentIndex) => `
          <section class="component-card">
            <div class="component-card-head">
              <div class="component-identity">
                <strong>Component ${componentIndex + 1}</strong>${component.existing ? `<span class="component-badge">Saved</span>` : ""}
                <label>Component name</label>
                <input maxlength="255" required placeholder="e.g. quote" value="${escapeHtml(component.name)}" data-component-name="${componentIndex}" ${component.existing ? "readonly" : ""}>
              </div>
              <div class="actions">
                <button type="button" class="icon-btn" title="Move component up" data-component-up="${componentIndex}" ${componentIndex === 0 ? "disabled" : ""}>↑</button>
                <button type="button" class="icon-btn" title="Move component down" data-component-down="${componentIndex}" ${componentIndex === draftComponents.length - 1 ? "disabled" : ""}>↓</button>
                <button type="button" class="icon-btn btn danger" title="Remove component" data-remove-component="${componentIndex}">×</button>
              </div>
            </div>
            <div class="component-fields">
              ${component.fields.map((field, fieldIndex) => `
                <div class="component-field">
                  <div>
                    <label>Field name</label>
                    <input maxlength="255" required placeholder="e.g. quote_text" value="${escapeHtml(field.name)}" data-field-name="${componentIndex}:${fieldIndex}" ${component.existing ? "readonly" : ""}>
                  </div>
                  <div>
                    <label>String value (optional)</label>
                    <input placeholder="Text value" value="${escapeHtml(field.value)}" data-field-value="${componentIndex}:${fieldIndex}" ${component.existing ? "readonly" : ""}>
                  </div>
                  <div>
                    <label>JSON data (optional)</label>
                    <textarea spellcheck="false" placeholder='{"key": "value"}' data-field-data="${componentIndex}:${fieldIndex}" ${component.existing ? "readonly" : ""}>${escapeHtml(field.dataText)}</textarea>
                  </div>
                  ${component.existing ? "" : `<button type="button" class="icon-btn btn danger" title="Remove field" data-remove-field="${componentIndex}:${fieldIndex}">×</button>`}
                </div>`).join("")}
            </div>
            ${component.existing ? "" : `<button type="button" class="btn secondary add-field" data-add-field="${componentIndex}">+ Field</button>`}
          </section>`).join("")
        : `<div class="component-empty">No components yet. Add one to build this lesson.</div>`;

      renderSavedComponentOptions();
      bindComponentEditor();
    }

    function renderSavedComponentOptions() {
      const assignedIds = new Set(draftComponents.filter(component => component.existing).map(component => component.id));
      const available = state.components.filter(component => !assignedIds.has(component.id));
      $("#savedComponentSelect").innerHTML = available.length
        ? available.map(component => `<option value="${component.id}">${escapeHtml(component.name)} · ${component.fields.length} field${component.fields.length === 1 ? "" : "s"}</option>`).join("")
        : `<option value="">No saved components available</option>`;
      $("#addSavedComponent").disabled = !available.length;
    }

    function bindComponentEditor() {
      document.querySelectorAll("[data-component-name]").forEach(input => {
        input.oninput = () => {
          draftComponents[Number(input.dataset.componentName)].name = input.value;
        };
      });
      document.querySelectorAll("[data-field-name]").forEach(input => {
        input.oninput = () => updateDraftField(input.dataset.fieldName, "name", input.value);
      });
      document.querySelectorAll("[data-field-value]").forEach(input => {
        input.oninput = () => updateDraftField(input.dataset.fieldValue, "value", input.value);
      });
      document.querySelectorAll("[data-field-data]").forEach(input => {
        input.oninput = () => updateDraftField(input.dataset.fieldData, "dataText", input.value);
      });
      document.querySelectorAll("[data-add-field]").forEach(button => {
        button.onclick = () => {
          draftComponents[Number(button.dataset.addField)].fields.push(newField());
          renderComponentEditor();
        };
      });
      document.querySelectorAll("[data-remove-field]").forEach(button => {
        button.onclick = () => {
          const [componentIndex, fieldIndex] = button.dataset.removeField.split(":").map(Number);
          draftComponents[componentIndex].fields.splice(fieldIndex, 1);
          renderComponentEditor();
        };
      });
      document.querySelectorAll("[data-remove-component]").forEach(button => {
        button.onclick = () => {
          draftComponents.splice(Number(button.dataset.removeComponent), 1);
          renderComponentEditor();
        };
      });
      document.querySelectorAll("[data-component-up]").forEach(button => {
        button.onclick = () => moveComponent(Number(button.dataset.componentUp), -1);
      });
      document.querySelectorAll("[data-component-down]").forEach(button => {
        button.onclick = () => moveComponent(Number(button.dataset.componentDown), 1);
      });
    }

    function updateDraftField(key, property, value) {
      const [componentIndex, fieldIndex] = key.split(":").map(Number);
      draftComponents[componentIndex].fields[fieldIndex][property] = value;
    }

    function moveComponent(index, direction) {
      [draftComponents[index], draftComponents[index + direction]] =
        [draftComponents[index + direction], draftComponents[index]];
      renderComponentEditor();
    }

    loadCourses().catch(error => notify(error.message, true));
  </script>
</body>
</html>
